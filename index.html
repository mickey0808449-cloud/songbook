<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23c2553a'/><path d='M26 16l24-5v30a7 7 0 1 1-4-6.3V20l-16 3.4V45a7 7 0 1 1-4-6.3z' fill='white'/></svg>">
<title>Jen的歌單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+TC:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f1d1a; --muted:#77716a; --line:#e6e1d8; --field:#fff; --tag:#f1eee8; --tagink:#5d574f;
  --accent:#c2553a; --accent-soft:#f6e3dc; --zh:#2f8f4e; --en:#2f6db3; --todo:#3a6ea5; --todo-soft:#e1ebf6; --head:rgba(246,244,239,.95);
  --radius:14px; --maxw:1000px;
  --font:"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;
  font-family:var(--font);
}
:root[data-theme="dark"]{
  --bg:#141312; --card:#1e1d1b; --ink:#ece8e1; --muted:#9a948b; --line:#33302c; --field:#252421; --tag:#2c2a27; --tagink:#c9c3b9;
  --accent:#e0795c; --accent-soft:#3a2620; --zh:#5cc97f; --en:#7ab4f0; --todo:#7aa7d8; --head:rgba(20,19,18,.92);
}
:root[data-font="serif"]{--font:"Noto Serif TC","Noto Serif JP",serif}
:root[data-font="kai"]{--font:"LXGW WenKai TC","Klee One","Noto Serif JP",serif}
:root[data-font="system"]{--font:system-ui,-apple-system,"PingFang TC","Hiragino Sans","Microsoft JhengHei",sans-serif}
:root[data-width="wide"]{--maxw:1540px}
:root[data-width="full"]{--maxw:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 80px}
header h1{margin:0;font-size:26px;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;align-items:center}
.toolbar input[type=search]{flex:1 1 200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;align-items:center}
.seg span.lbl{font-size:13px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.section-switch{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.section-switch button{flex:0 0 auto}
.metadata-review{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:0 0 16px}
.metadata-review summary,.research-note summary{cursor:pointer;font-weight:500}
.metadata-review p,.research-note p{font-size:13px;line-height:1.7;color:var(--muted)}
.metadata-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.metadata-items{padding-left:22px;font-size:13px;line-height:1.8;max-height:280px;overflow:auto}
.research-note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.research-note a{color:var(--todo)}
.btn{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 14px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
section.panel{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
section.panel h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
section.panel h2 .count{font-size:13px;font-weight:500;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.addform{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:12px}
.addform input,.addform select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);min-width:0}
.group-h{font-size:12px;color:var(--muted);margin:12px 0 6px;letter-spacing:.05em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.song{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-width:0}
.song:hover{border-color:var(--muted)}
.song .t{font-weight:600;font-size:17px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .m{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--tag);color:var(--tagink)}
.tag.lyr{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
footer{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* detail */
#detail{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:10}
#detail.open{display:block}
.dhead{position:sticky;top:0;background:var(--head);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:2}
.dhead .in{max-width:var(--maxw);margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
.dhead .btn{padding:10px 16px;font-size:15px;font-weight:500;white-space:nowrap}
#back{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
:root[data-theme="dark"] #back{background:var(--accent);color:#fff}
.dhead .sp{flex:1}
.dtitle{font-size:26px;margin:18px 0 2px}
.dartist{color:var(--muted);margin:0 0 12px}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.info .tag{font-size:13px;padding:3px 9px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;font-size:13px}
.links a{color:var(--todo)}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.lyrics{background:var(--card);border-radius:var(--radius);padding:20px 18px}
.ln{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln .no{flex:none;width:32px;height:32px;border-radius:50%;background:var(--tag);color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:6px}
.ln .body{flex:1;min-width:0}
.ln .o{font-size:19px;line-height:1.5}
.ln .zh{font-size:16px;color:var(--zh);margin-top:3px}
.ln .en{font-size:15px;color:var(--en);margin-top:3px}
.sec{height:22px}
.ln .o.fu{padding-top:.6em;line-height:2.35}
.ln .r{font-size:13px;color:var(--muted);margin-top:1px;font-family:system-ui,sans-serif}
.rb{position:relative;display:inline-block;line-height:1}
.rt{position:absolute;left:-3em;right:-3em;bottom:100%;text-align:center;font-size:.48em;line-height:1;color:var(--accent);white-space:nowrap;margin-bottom:1px}
.note{font-size:13px;color:var(--muted);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.editor{display:grid;gap:10px;background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.editor .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.editor label{font-size:12px;color:var(--muted);display:grid;gap:4px;align-content:start}
.editor .row{align-items:start}
.editor input,.editor select{height:40px}
.editor input,.editor select,.editor textarea{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);width:100%}
.editor textarea{min-height:420px;line-height:1.6;resize:vertical}
.tx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){
  .tx{grid-template-columns:1fr}
  .addform{grid-template-columns:1fr 90px}
  .addform .btn{grid-column:1/-1}
  .dhead .in{padding:10px 12px;gap:6px}
  .dhead .btn{padding:8px 11px;font-size:14px}
  .list{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
}
.status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:50;max-width:90vw;text-align:center}
.status.show{display:block}

.hrow{display:flex;align-items:flex-start;gap:12px}.hrow header{flex:1}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:18px;line-height:1}
#settings{position:fixed;top:64px;right:16px;width:300px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:30;display:none}
#settings.open{display:block}
#settings h3{margin:0 0 8px;font-size:14px}
#settings .grp{margin-bottom:14px}
.segbar{display:flex;background:var(--tag);border-radius:10px;padding:3px;gap:2px}
.segbar button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:14px;color:var(--muted)}
.segbar button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#settings .hint{font-size:12px;color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:4px 0 16px}
.filters .frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}
.filters .lbl{font-size:13px;color:var(--muted);width:44px;flex:none}
.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--field);font-size:13px;max-width:220px}
.filters .clear{margin-left:auto;font-size:13px;color:var(--accent);background:none;border:0;padding:4px 6px}
.chip.f.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bpmrow{display:flex;gap:6px}.bpmrow input{flex:1;min-width:60px}
.hint{font-size:12px;color:var(--muted)}
#tapBtn.flash{background:var(--accent);color:#fff;border-color:var(--accent)}
/* PDF pages (offscreen) */
#pdfstage{position:fixed;left:-20000px;top:0}
.pg{width:794px;height:1123px;background:#fff;padding:60px 64px;overflow:hidden;color:#1f1d1a;font-family:var(--font)}
.pg .ln .r{color:#8a837a}.pg .ln .zh{color:#2f8f4e}.pg .ln .en{color:#2f6db3}.pg .ln{border-color:#e6e1d8}.pg .ln .no{background:#f1eee8;color:#77716a}
.pg .ph{border-bottom:2px solid #1f1d1a;padding-bottom:10px;margin-bottom:22px}
.pg .ph .pt{font-size:28px;font-weight:700}
.pg .ph .pm{font-size:13px;color:#77716a;margin-top:4px}
.pg .ph.cont .pt{font-size:16px}
.pg .ln .o{font-size:18px}
.pg .rt{color:#c2553a}
</style>
</head>
<body>
<div class="wrap" id="home">
  <div class="hrow">
    <header>
      <h1>Jen的歌單</h1>
      <p id="summary"></p>
    </header>
    <button class="gear" id="gearBtn" aria-label="顯示設定">⚙︎</button>
  </div>

  <nav class="section-switch" id="sectionSwitch" aria-label="歌曲分區"></nav>

  <div class="toolbar">
    <input type="search" id="q" placeholder="搜尋歌名或歌手">
    <button class="btn" id="pdfAll">匯出目前清單 PDF</button>
    <button class="btn" id="reviewMetadata">補齊歌曲資料</button>
  </div>
  <div class="seg" id="groupSeg"><span class="lbl">分組</span></div>
  <div class="filters" id="filters"></div>

  <details class="metadata-review" id="metadataReview">
    <summary id="metadataSummary">歌曲資料補充</summary>
    <p>依原唱版本核對，只補空白 BPM 與參考 Key。已填的數值、歌曲狀態、備註與歌詞都會保留。部分歌曲有轉調或版本差異，仍需搭配實際伴奏確認。</p>
    <div id="metadataPreview"></div>
    <div class="metadata-actions">
      <button type="button" class="btn primary" id="applyMetadata">補齊空白資料</button>
      <button type="button" class="btn" id="autoFetchMissing">自動抓取缺漏資料（網路）</button>
      <label class="btn">從 JSON 補齊空欄（含歌詞）<input type="file" id="mergeJson" accept=".json,application/json" hidden></label>
      <button type="button" class="btn" id="downloadMetadataBackup" hidden>下載更新前備份</button>
    </div>
    <p id="metadataPending"></p>
    <p>來源與疑點可在每首歌曲的「資料核對」中查看。</p>
  </details>

  <section class="panel" id="secDone">
    <h2><span class="dot" style="background:var(--accent)"></span>已練 <span class="count" id="cDone"></span></h2>
    <div id="listDone"></div>
  </section>

  <section class="panel" id="secPracticing" hidden>
    <h2><span class="dot" style="background:var(--zh)"></span>練習中 <span class="count" id="cPracticing"></span></h2>
    <div id="listPracticing"></div>
  </section>

  <section class="panel" id="secBase" hidden>
    <h2><span class="dot" style="background:var(--muted)"></span>基礎 <span class="count" id="cBase"></span></h2>
    <div id="listBase"></div>
  </section>

  <section class="panel" id="secTodo" hidden>
    <h2><span class="dot" style="background:var(--todo)"></span>待練 <span class="count" id="cTodo"></span></h2>
    <form class="addform" id="addForm">
      <input id="addTitle" placeholder="輸入想練的歌名" required>
      <select id="addLang"><option value="ja">日文</option><option value="zh">中文</option><option value="en">英文</option><option value="ko">韓文</option><option value="other">其他</option></select>
      <button class="btn primary" type="submit">加入待練</button>
    </form>
    <div id="listTodo"></div>
  </section>

  <footer>
    <span>資料自動與雲端同步（手機／電腦互通）。</span>
    <button class="btn small" id="exp">備份（匯出 JSON）</button>
    <label class="btn small">還原（匯入 JSON）<input type="file" id="imp" accept=".json,application/json" hidden></label>
  </footer>
</div>

<div id="detail" aria-hidden="true">
  <div class="dhead"><div class="in">
    <button class="btn" id="back">← 返回</button>
    <span class="sp"></span>
    <button class="btn" id="editBtn">編輯</button>
    <select class="btn" id="statusSel" aria-label="分區"><option value="done">已練</option><option value="practicing">練習中</option><option value="base">基礎</option><option value="todo">待練</option></select>
    <button class="btn primary" id="pdfOne">匯出 PDF</button>
  </div></div>
  <div class="wrap" id="dbody"></div>
</div>

<div id="settings" role="dialog" aria-label="顯示設定">
  <div class="grp"><h3>主題</h3><div class="segbar" data-set="theme"><button data-v="system">跟系統</button><button data-v="light">淺色</button><button data-v="dark">深色</button></div></div>
  <div class="grp"><h3>字體</h3><div class="segbar" data-set="font"><button data-v="sans">黑體</button><button data-v="serif">宋體</button><button data-v="kai">楷體</button><button data-v="system">系統</button></div></div>
  <div class="grp"><h3>版面寬度</h3><div class="segbar" data-set="width"><button data-v="normal">標準</button><button data-v="wide">寬</button><button data-v="full">滿版</button></div></div>
  <div class="grp"><h3>雲端同步與自動抓資料</h3><div style="display:flex;gap:6px"><button type="button" class="btn small" id="syncNowBtn" style="flex:1">立即同步雲端</button><button type="button" class="btn small" id="autoFetchSetBtn" style="flex:1">抓取缺漏資料</button></div></div>
  <div class="hint">歌單已接上專屬雲端同步（免填 Token），手機與電腦新增／改分區會自動互通，排程也會自動補齊缺漏的歌手、BPM、Key 與雙語歌詞。</div>
</div>
<div id="pdfstage"></div>
<div class="status" id="status"></div>

function mergeSeed(){ // fill in researched info without overwriting the user's own edits

  SEED.forEach((r,i)=>{
    const candidates=songs.filter(x=>!used.has(x)&&(x.title===r[0]||(r[7]&&x.title===r[7])));
    const sameArtist=x=>String(x.artist||"").normalize("NFKC").trim().toLowerCase()===r[1].normalize("NFKC").trim().toLowerCase();
    let s=candidates.find(sameArtist)||(candidates.length===1&&(!candidates[0].artist||(r[0]==="魚"&&candidates[0].artist==="陳綺貞"))?candidates[0]:null);
    if(!s){s=seedObj(r,i);songs.push(s);used.add(s);return}

const metadataTitle=s=>String(s?.title||"").normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");

function metadataPlan(list){
  const counts=new Map();for(const s of list){const key=metadataIdentity(s);counts.set(key,(counts.get(key)||0)+1)}
  return list.flatMap((s,index)=>{
    if(counts.get(metadataIdentity(s))!==1)return [];
    const r=researchFor(s);if(!r)return [];
    const changes={};
    if(emptyMetadata(s.artist)&&r.artist)changes.artist=r.artist;
    if((emptyMetadata(s.bpm)||Math.abs(s.bpm-r.bpm*2)<=1||Math.abs(s.bpm*2-r.bpm)<=1)&&Number.isFinite(r.bpm)&&r.bpm>0&&s.bpm!==r.bpm)changes.bpm=r.bpm;
    if(emptyMetadata(s.key)&&r.key)changes.key=r.key;
    if(emptyMetadata(s.genre)&&r.genre)changes.genre=r.genre;
    if(emptyMetadata(s.lyrics)&&r.lyrics)changes.lyrics=r.lyrics;
    return Object.keys(changes).length?[{index,title:s.title,artist:s.artist||r.artist,changes}]:[];
  });
}

function applyReviewedMetadata(){

  const next=songs.map(s=>({...s}));for(const p of plan)Object.assign(next[p.index],p.changes);

// Parse inline manual overrides `漢字(かな)` or `漢字（かな）`, plus JA_READINGS dictionary
function splitJaOverrides(line){
  const parts=[];let i=0;
  // First check explicit inline ruby like 描(か) or 希望（ひかり）
  const re=/([一-鿿㐀-䶿々〆0-9０-９]+)[（(]([ぁ-んァ-ヶー]+)[）)]/g;
  let m,last=0;
  const rawSegs=[];
  while((m=re.exec(line))){
    if(m.index>last)rawSegs.push({text:line.slice(last,m.index)});
    rawSegs.push({fixed:[[m[1],m[2]]],kana:m[2]});
    last=re.lastIndex;
  }
  if(last<line.length)rawSegs.push({text:line.slice(last)});
  for(const seg of rawSegs){
    if(seg.fixed){parts.push(seg);continue}
    const s=seg.text;let pos=0,buf="";
    while(pos<s.length){
      let hit=null;
      for(const r of JA_READINGS){
        if(s.startsWith(r[0],pos)){hit=r;break}
      }
      if(hit){
        if(buf){parts.push({text:buf});buf=""}
        parts.push({fixed:hit[2],kana:hit[1]});
        pos+=hit[0].length;
      }else{buf+=s[pos++]}
    }
    if(buf)parts.push({text:buf});
  }
  return parts;
}
function rubyToSpans(html){
  const t=document.createElement("template");t.innerHTML=html;let out="";
  t.content.childNodes.forEach(n=>{
    if(n.nodeType===3){out+=esc(n.textContent);return}
    if(n.nodeName==="RUBY"){let base="",rt="";n.childNodes.forEach(c=>{if(c.nodeName==="RT")rt+=c.textContent;else if(c.nodeName!=="RP")base+=c.textContent});
      out+=`<span class="rb"><span class="rt">${esc(rt)}</span>${esc(base)}</span>`}
    else out+=esc(n.textContent);
  });return out;
}
function fixedToSpans(pairs){
  return pairs.map(([base,rt])=>rt?`<span class="rb"><span class="rt">${esc(rt)}</span>${esc(base)}</span>`:esc(base)).join("");
}
const hasKanji=s=>/[一-鿿㐀-䶿々〆0-9０-９]/.test(s);
async function furi(line){
  if(!hasKanji(line))return esc(line);
  if(furiCache.has(line))return furiCache.get(line);
  const k=await getKuro();
  const segs=splitJaOverrides(line);
  let h="";
  for(const seg of segs){
    if(seg.fixed)h+=fixedToSpans(seg.fixed);
    else if(hasKanji(seg.text))h+=rubyToSpans(await k.convert(seg.text,{to:"hiragana",mode:"furigana"}));
    else h+=esc(seg.text);
  }
  furiCache.set(line,h);return h;
}
// Fix kuromoji's sokuon (っ) bug where っ at the end of a token becomes "tsu" before the next consonant
function kanaToHepburn(hira){
  const dig={きゃ:"kya",きゅ:"kyu",きょ:"kyo",しゃ:"sha",しゅ:"shu",しょ:"sho",ちゃ:"cha",ちゅ:"chu",ちょ:"cho",にゃ:"nya",にゅ:"nyu",にょ:"nyo",ひゃ:"hya",ひゅ:"hyu",ひょ:"hyo",みゃ:"mya",みゅ:"myu",みょ:"myo",りゃ:"rya",りゅ:"ryu",りょ:"ryo",ぎゃ:"gya",ぎゅ:"gyu",ぎょ:"gyo",じゃ:"ja",じゅ:"ju",じょ:"jo",びゃ:"bya",びゅ:"byu",びょ:"byo",ぴゃ:"pya",ぴゅ:"pyu",ぴょ:"pyo",ふぁ:"fa",ふぃ:"fi",ふぇ:"fe",ふぉ:"fo",てぃ:"ti",でぃ:"di",うぃ:"wi",うぇ:"we",うぉ:"wo",ゔぁ:"va",ゔぃ:"vi",ゔぇ:"ve",ゔぉ:"vo",ちぇ:"che",しぇ:"she",じぇ:"je",つぁ:"tsa",つぃ:"tsi",つぇ:"tse",つぉ:"tso"};
  const mon={あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",を:"o",ん:"n",が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゃ:"ya",ゅ:"yu",ょ:"yo",ゔ:"vu"};
  const s=hira.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/(^|\s)は(?=\s|$)/g,"$1わ")
    .replace(/(^|\s)へ(?=\s|$)/g,"$1え");
  let out="",i=0;
  while(i<s.length){
    if(s[i]==="っ"){
      let j=i+1;while(s[j]===" ")j++;
      const nxt=dig[s.slice(j,j+2)]||mon[s[j]]||"";
      if(nxt&&/^[a-z]/.test(nxt)){out+=nxt.startsWith("ch")?"t":nxt[0];i++;continue}
      i++;continue;
    }
    if(s[i]==="ー"){
      const last=out[out.length-1];
      const mac={a:"ā",i:"ī",u:"ū",e:"ē",o:"ō"};
      if(mac[last])out=out.slice(0,-1)+mac[last];
      i++;continue;
    }
    const d=dig[s.slice(i,i+2)];
    if(d){out+=d;i+=2;continue}
    const m=mon[s[i]];
    if(m){out+=m;i++;continue}
    out+=s[i++];
  }
  return out.replace(/\s+/g," ").replace(/\s+([,、。!?！？…」』])/g,"$1").replace(/([「『（(])\s+/g,"$1").trim();
}
async function roma(line){
  if(!line.trim())return"";
  if(romaCache.has(line))return romaCache.get(line);
  const k=await getKuro();
  const segs=splitJaOverrides(line);
  let hira="";
  for(const seg of segs){
    if(seg.fixed)hira+=" "+seg.kana+" ";
    else{
      const h=await k.convert(seg.text,{to:"hiragana",mode:"spaced"});
      hira+=" "+h+" ";
    }
  }
  // Merge sokuon (っ) with following kana so でき なかっ た -> deki nakatta (not nakatsu ta)
  hira=hira.replace(/っ\s+/g,"っ").replace(/\s+っ/g,"っ").replace(/\s+/g," ").trim();
  const r=kanaToHepburn(hira);
  romaCache.set(line,r);return r;
}

/* ---------- lyric rendering (shared by screen + PDF) ---------- */
// 歌詞格式：每一句一塊，塊與塊之間空一行；塊內第一行是原文，下面接中文/英文翻譯（順序不拘）。空兩行＝分段。
const KANA=/[぀-ヿ]/, HAN=/[一-鿿㐀-䶿]/, LATIN=/[A-Za-z]/;
function lineLang(t){if(KANA.test(t))return"ja";if(HAN.test(t))return"zh";if(LATIN.test(t))return"en";return"x"}
function parseLyrics(text){
  const lines=(text||"").replace(/\r/g,"").split("\n");const out=[];let cur=null,blank=0;
  for(const raw of lines){const t=raw.trim();
    if(!t){blank++;if(cur){out.push(cur);cur=null}continue}
    if(!cur){cur={orig:t,zh:[],en:[],sec:out.length>0&&blank>=2};blank=0;continue}
    blank=0;const l=lineLang(t);(l==="en"?cur.en:cur.zh).push(t);
  }
  if(cur)out.push(cur);return out;
}
function langsIn(s){const b=parseLyrics(s.lyrics);return{zh:b.some(x=>x.zh.length),en:b.some(x=>x.en.length)}}
async function lyricBlocks(s,opt){
  const ja=s.lang==="ja",blocks=[];let n=0;
  for(const b of parseLyrics(s.lyrics)){
    n++; if(b.sec)blocks.push('<div class="sec"></div>');
    let body="";
    if(opt.orig){let oh=esc(b.orig);if(ja&&opt.furi)oh=await furi(b.orig);body+=`<div class="o${ja&&opt.furi?" fu":""}">${oh}</div>`}
    if(ja&&opt.roma)body+=`<div class="r">${esc(await roma(b.orig))}</div>`;
    if(opt.zh)b.zh.forEach(t=>body+=`<div class="zh">${esc(t)}</div>`);
    if(opt.en)b.en.forEach(t=>body+=`<div class="en">${esc(t)}</div>`);
    if(!body)continue;
    blocks.push(`<div class="ln"><span class="no">${n}</span><div class="body">${body}</div></div>`);
  }
  return blocks;
}
function combineOld(lyr,tr){ // migrate old two-box format
  const o=(lyr||"").replace(/\r/g,"").split("\n"),t=(tr||"").replace(/\r/g,"").split("\n"),out=[];
  o.forEach((l,i)=>{if(!l.trim()){out.push("");return}out.push(l+((t[i]||"").trim()?"\n"+t[i].trim():"")+"\n")});
  return out.join("\n").replace(/\n{4,}/g,"\n\n\n").trim();
}

let pdfLibP=null;
function pdfLibs(){return pdfLibP||(pdfLibP=Promise.all([
  loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
  loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]).catch(e=>{pdfLibP=null;throw e}))}
async function exportPDF(list,opt,filename){
  list=list.filter(s=>s.lyrics&&s.lyrics.trim());
  if(!list.length){toast("這些歌還沒有歌詞，沒有東西可以匯出");return}
  toast("產生 PDF 中…",0);
  try{
    await pdfLibs();
    const stage=$("#pdfstage");stage.innerHTML="";const pages=[];
    const H=1123;
    for(const s of list){
      const meta=[s.artist,LANG[s.lang],s.bpm?s.bpm+" BPM":"",s.key?"Key "+s.key:""].filter(Boolean).join(" · ");
      const blocks=await lyricBlocks(s,opt);
      const newPage=(cont)=>{const p=document.createElement("div");p.className="pg";
        p.innerHTML=`<div class="ph ${cont?"cont":""}"><div class="pt">${esc(s.title)}${cont?"（續）":""}</div>${cont?"":`<div class="pm">${esc(meta)}</div>`}</div>`;
        stage.appendChild(p);pages.push(p);return p};
      let p=newPage(false);
      for(const b of blocks){
        const w=document.createElement("div");w.innerHTML=b;const el=w.firstElementChild;p.appendChild(el);
        if(p.scrollHeight>H){p.removeChild(el);if(el.className==="sec")continue;p=newPage(true);p.appendChild(el)}
      }
    }
    await new Promise(r=>setTimeout(r,250));await document.fonts.ready;
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4"});
    for(let i=0;i<pages.length;i++){
      const c=await html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false});
      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
    }
    stage.innerHTML="";
    pdf.save(filename);untoast();
  }catch(e){console.error(e);toast("PDF 產生失敗："+(e.message||e))}
}

    const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming))throw Error("format");
    const counts=new Map();for(const s of songs){const k=metadataIdentity(s);counts.set(k,(counts.get(k)||0)+1)}
    const inMap=new Map(),inTitleMap=new Map();
    for(const s of incoming){
      const k=metadataIdentity(s);if(!inMap.has(k))inMap.set(k,s);
      const tk=metadataTitle(s);inTitleMap.set(tk,inTitleMap.has(tk)?null:s);
    }
    const next=songs.map(s=>({...s})),matchedSrc=new Set();let updated=0,added=0;
    for(let i=0;i<next.length;i++){
      const s=next[i],k=metadataIdentity(s);if(counts.get(k)!==1)continue;
      const src=inMap.get(k)||(emptyMetadata(s.artist)?inTitleMap.get(metadataTitle(s)):null);if(!src)continue;
      matchedSrc.add(metadataIdentity(src));
      let chg=false;
      for(const fld of ["artist","bpm","key","genre","lyrics","note"]){
        if((emptyMetadata(s[fld])||(fld==="bpm"&&(Math.abs(s.bpm-src.bpm*2)<=1||Math.abs(s.bpm*2-src.bpm)<=1)&&s.bpm!==src.bpm))&&!emptyMetadata(src[fld])){s[fld]=src[fld];chg=true}
      }
      if(chg)updated++;
    }
    const existingKeys=new Set(next.map(metadataIdentity));
    for(const src of incoming){
      const k=metadataIdentity(src);
      if(!existingKeys.has(k)&&!matchedSrc.has(k)){next.push(blank(src));existingKeys.add(k);added++}
    }
    if(!updated&&!added){toast("沒有新的空白欄位或歌曲需要補齊");return}
    localStorage.setItem(KEY+".metadata-backup",JSON.stringify({created:new Date().toISOString(),songs}));
    localStorage.setItem(KEY,JSON.stringify(next));
    songs=next;renderHome();toast(`已安全補齊 ${updated} 首歌的空白資料（含歌詞）`+(added?`，並新增 ${added} 首`:""));
  }catch(_){toast("檔案格式不對或瀏覽器儲存空間不足")}
};

/* ---------- auto-enrich missing song data & cloud sync ---------- */
const CLOUD_SYNC_URL="https://script.google.com/macros/s/AKfycbxzSOeZrjNUOb9xsCT9Z1-eZYURn7Seeb4TO-uJYo0vtogiMIi2Dq8t_qUIYPPGKRb32A/exec";
const ITUNES_API="https://itunes.apple.com/search";
const LRCLIB_API="https://lrclib.net/api/search";
const GTX_API="https://translate.googleapis.com/translate_a/single";
const JINA_YAHOO_API="https://r.jina.ai/https://search.yahoo.co.jp/search?p=";
const MB_API="https://musicbrainz.org/ws/2/recording/";
const AB_API="https://acousticbrainz.org/api/v1/";
const triedAutoIds=new Set();
const deletedSongIds=new Set();
let autoRunning=false;

function mapAutoGenre(raw){
  const g=String(raw||"").toLowerCase();
  if(/rock|punk|metal|alternative|ロック|搖滾/.test(g))return"搖滾";
  if(/folk|acoustic|singer|民謠/.test(g))return"民謠";
  if(/r&b|soul/.test(g))return"R&B";
  if(/hip-hop|rap|說唱|饒舌/.test(g))return"說唱";
  if(/anime|soundtrack|アニメ|動漫|原聲/.test(g))return"動漫/影視";
  if(/ballad|抒情/.test(g))return"抒情";
  return"流行";
}
function modeVal(arr){
  if(!arr.length)return null;
  const m=new Map();for(const x of arr)m.set(x,(m.get(x)||0)+1);
  return[...m.entries()].sort((a,b)=>b[1]-a[1])[0][0];
}
async function fetchItunesMeta(title,artist,lang){
  const countries=lang==="ja"?["JP","TW","US"]:lang==="zh"?["TW","HK","US"]:["US","TW","JP"];
  const norm=s=>String(s||"").normalize("NFKC").toLowerCase().trim();
  const target=norm(title);
  for(const c of countries){
    try{
      const q=artist?`${title} ${artist}`:title;
      const r=await fetch(`${ITUNES_API}?term=${encodeURIComponent(q)}&entity=song&country=${c}&limit=8`);
      if(!r.ok)continue;
      const d=await r.json();if(!d.results?.length)continue;
      const hit=d.results.find(x=>norm(x.trackName).includes(target)||target.includes(norm(x.trackName)))||d.results[0];
      return{artist:hit.artistName||artist||"",genre:mapAutoGenre(hit.primaryGenreName)};
    }catch(_){}
  }
  return{artist:artist||"",genre:""};
}
async function fetchBpmKeyMeta(title,artist,genre){
  const clean=String(title||"").replace(/\s*[-(-].*$/,"").trim()||title;
  const bpms=[],keys=[];
  try{
    const r=await fetch(JINA_YAHOO_API+encodeURIComponent(`${clean} ${artist} BPM 原曲キー Key`));
    if(r.ok){
      const txt=(await r.text()).replace(/\s+/g," ");
      for(const m of txt.matchAll(/(?:BPM|テンポ)\s*(?:は|：|:|=|＝|約)?\s*(\d{2,3})\b|\b(\d{2,3})\s*BPM\b/gi)){
        const n=+(m[1]||m[2]);if(n>=40&&n<=240)bpms.push(n);
      }
      const pats=[
        /(?:原曲キー|キー|Key|調性|原調)\s*(?:は|：|:|=|＝|in)?\s*([A-G](?:#|b|♯|♭)?(?:m|minor|major|マイナー|メジャー)?)(?![a-zA-Z])/g,
        /\b([A-G](?:#|b|♯|♭)?)\s*(?:メジャー|マイナー|大調|小調)/g,
        /\bin\s+([A-G](?:#|b|♯|♭)?)\s+(?:Major|Minor)\b/g
      ];
      for(const p of pats)for(const m of txt.matchAll(p)){
        let k=m[1].replace("♯","#").replace("♭","b");
        if(/minor|マイナー|小調|m$/.test(m[0])&&!k.endsWith("m"))k+="m";
        k=k.replace(/(?:major|minor|メジャー|マイナー)$/i,"");
        if(/^[A-G](#|b)?m?$/.test(k))keys.push(k);
      }
    }
  }catch(_){}
  if(!bpms.length||!keys.length){
    try{
      const mr=await fetch(`${MB_API}?query=recording:${encodeURIComponent(clean)}${artist?"%20AND%20artist:"+encodeURIComponent(artist):""}&limit=4&fmt=json`);
      if(mr.ok){
        const md=await mr.json();
        for(const rec of(md.recordings||[])){
          const ar=await fetch(`${AB_API}${rec.id}/low-level`);
          if(ar.ok){
            const ab=await ar.json();
            if(ab.rhythm?.bpm)bpms.push(Math.round(ab.rhythm.bpm));
            if(ab.tonal?.key_key)keys.push(ab.tonal.key_key+(ab.tonal.key_scale==="minor"?"m":""));
            break;
          }
        }
      }
    }catch(_){}
  }
  let bpm=modeVal(bpms);
  if(bpm&&bpm>100&&(genre==="抒情"||genre==="民謠"||bpm>=126)&&genre!=="搖滾")bpm=Math.round(bpm/2);
  return{bpm:bpm||null,key:modeVal(keys)||""};
}
async function translateLinesZhTW(lines,lang){
  if(!lines.length)return[];
  const sl=lang==="zh"?"zh-CN":lang==="ja"?"ja":lang==="en"?"en":"auto";
  const out=[];
  for(let i=0;i<lines.length;i+=25){
    const chunk=lines.slice(i,i+25);
    try{
      const r=await fetch(`${GTX_API}?client=gtx&sl=${sl}&tl=zh-TW&dt=t&q=${encodeURIComponent(chunk.join("\n"))}`);
      if(r.ok){
        const d=await r.json();
        const sp=(d[0]||[]).map(x=>x[0]).join("").split("\n").map(s=>s.trim());
        for(let j=0;j<chunk.length;j++)out.push(sp[j]||"");
        continue;
      }
    }catch(_){}
    for(let j=0;j<chunk.length;j++)out.push("");
  }
  return out;
}
async function fetchBilingualLyrics(title,artist,lang){
  const clean=String(title||"").replace(/\s*[-(-].*$/,"").trim()||title;
  const urls=[
    `${LRCLIB_API}?track_name=${encodeURIComponent(clean)}&artist_name=${encodeURIComponent(artist||"")}`,
    `${LRCLIB_API}?q=${encodeURIComponent((clean+" "+(artist||"")).trim())}`,
    `${LRCLIB_API}?q=${encodeURIComponent(clean)}`
  ];
  let plain="";
  for(const u of urls){
    try{
      const r=await fetch(u);if(!r.ok)continue;
      const arr=await r.json();if(!Array.isArray(arr)||!arr.length)continue;
      const hit=arr.find(x=>x.plainLyrics&&x.plainLyrics.trim().length>40)||arr.find(x=>x.syncedLyrics&&x.syncedLyrics.trim().length>40);
      if(hit){plain=hit.plainLyrics||hit.syncedLyrics.replace(/\[[\d:.]+\]\s*/g,"");break}
    }catch(_){}
  }
  if(!plain)return"";
  const rawLines=plain.replace(/\r/g,"").trim().split("\n");
  const lines=[],struct=[];let blanks=0;
  for(const raw of rawLines){
    const t=raw.trim();if(!t){blanks++;continue}
    if(blanks>0&&lines.length>0)struct.push({type:"sec"});
    blanks=0;struct.push({type:"line",idx:lines.length,text:t});lines.push(t);
  }
  const zhLines=await translateLinesZhTW(lines,lang);
  const blocks=[];let sec=false;
  for(const it of struct){
    if(it.type==="sec"){sec=true;continue}
    const zh=zhLines[it.idx];
    const blk=lang==="zh"?(zh||it.text):(zh&&zh!==it.text?`${it.text}\n${zh}`:it.text);
    blocks.push((sec?"\n":"")+blk);sec=false;
  }
  return blocks.join("\n\n").trim();
}
async function autoEnrichSong(s,opt={}){
  if(!s)return false;
  const ref=researchFor(s);
  const filled=[];
  if(ref){
    if(emptyMetadata(s.artist)&&ref.artist){s.artist=ref.artist;filled.push("歌手")}
    if(emptyMetadata(s.genre)&&ref.genre){s.genre=ref.genre;filled.push("風格")}
    if(emptyMetadata(s.bpm)&&ref.bpm){s.bpm=ref.bpm;filled.push("BPM")}
    if(emptyMetadata(s.key)&&ref.key){s.key=ref.key;filled.push("Key")}
    if(emptyMetadata(s.lyrics)&&ref.lyrics){s.lyrics=ref.lyrics;filled.push("歌詞")}
  }
  const needArtist=emptyMetadata(s.artist),needGenre=emptyMetadata(s.genre),needBpm=emptyMetadata(s.bpm),needKey=emptyMetadata(s.key),needLyrics=emptyMetadata(s.lyrics);
  if(needArtist||needGenre||needBpm||needKey||needLyrics){
    if(opt.notify)toast(`正在自動抓取「${s.title}」的缺漏資料…`,0);
    if(needArtist||needGenre){
      const it=await fetchItunesMeta(s.title,s.artist,s.lang||"ja");
      if(needArtist&&it.artist){s.artist=it.artist;filled.push("歌手")}
      if(needGenre&&it.genre){s.genre=it.genre;filled.push("風格")}
    }
    if(needBpm||needKey){
      const bk=await fetchBpmKeyMeta(s.title,s.artist,s.genre);
      if(needBpm&&bk.bpm){s.bpm=bk.bpm;filled.push("BPM")}
      if(needKey&&bk.key){s.key=bk.key;filled.push("Key")}
    }
    if(needLyrics){
      const lyr=await fetchBilingualLyrics(s.title,s.artist,s.lang||"ja");
      if(lyr){s.lyrics=lyr;filled.push("歌詞")}
    }
  }
  triedAutoIds.add(s.id);
  if(filled.length){
    s.updated=Date.now();
    save();renderHome();if(cur===s){editing=false;renderDetail()}
    if(opt.notify)toast(`已自動補齊「${s.title}」：${[...new Set(filled)].join("、")}`);
    if(opt.syncCloud)pushToCloud({changedIds:[s.id]});
    return true;
  }
  if(opt.notify)toast(`「${s.title}」目前沒有可新補齊的公開資料`);
  if(opt.syncCloud)pushToCloud({changedIds:[s.id]});
  return false;
}
async function autoEnrichAllMissing(opt={}){
  if(autoRunning)return;
  const targets=songs.filter(s=>(opt.force||!triedAutoIds.has(s.id))&&(emptyMetadata(s.artist)||emptyMetadata(s.genre)||emptyMetadata(s.bpm)||emptyMetadata(s.key)||emptyMetadata(s.lyrics)));
  if(!targets.length){if(opt.notify)toast("目前所有歌曲的歌手、BPM、Key 與歌詞都已完整！");return}
  autoRunning=true;
  if(opt.notify)toast(`正在自動抓取 ${targets.length} 首缺資料的歌曲…`,0);
  let count=0;const changedIds=[];
  try{
    for(const s of targets){
      if(await autoEnrichSong(s,{notify:false,force:opt.force})){count++;changedIds.push(s.id)}
    }
    if(count>0){
      toast(`已自動補齊 ${count} 首歌的缺漏資料！`);
      pushToCloud({changedIds});
    }else if(opt.notify){
      toast("已完成檢查，暫無可新增的公開資料");
    }
  }finally{autoRunning=false}
}
function mergeRemoteList(remote,delIds=[]){
  let changed=false;
  const delSet=new Set([...deletedSongIds,...delIds]);
  if(delSet.size){
    const before=songs.length;
    songs=songs.filter(s=>!delSet.has(s.id));
    if(songs.length!==before)changed=true;
  }
  const norm=x=>String(x||"").normalize("NFKC").trim().toLowerCase();
  for(const rs of remote){
    if(!rs||!rs.title||delSet.has(rs.id))continue;
    let loc=songs.find(s=>(s.id&&rs.id&&s.id===rs.id)||(norm(s.title)===norm(rs.title)&&(!s.artist||!rs.artist||norm(s.artist)===norm(rs.artist))));
    if(!loc){
      const nl=blank(rs);
      const ref=researchFor(nl);if(ref&&emptyMetadata(nl.lyrics)&&ref.lyrics)nl.lyrics=ref.lyrics;
      songs.push(nl);changed=true;continue;
    }
    const rNewer=(rs.updated||0)>(loc.updated||0);
    if(rNewer&&rs.status&&loc.status!==rs.status){loc.status=rs.status;changed=true}
    else if(loc.status==="todo"&&["practicing","base"].includes(rs.status)){loc.status=rs.status;changed=true}
    for(const f of ["artist","genre","bpm","key","lyrics","note"]){
      if((emptyMetadata(loc[f])||(rNewer&&!emptyMetadata(rs[f])&&loc[f]!==rs[f]))&&!emptyMetadata(rs[f])){loc[f]=rs[f];changed=true}
    }
    if(rNewer)loc.updated=rs.updated;
  }
  return changed;
}
async function syncFromCloud(opt={}){
  let changed=false;
  try{
    const cr=await fetch(CLOUD_SYNC_URL,{cache:"no-store"});
    if(cr.ok){
      const cd=await cr.json();
      if(cd&&Array.isArray(cd.songs)&&mergeRemoteList(cd.songs,cd.deletedIds||[]))changed=true;
    }
  }catch(_){}
  try{
    const r=await fetch("research/songs-reviewed.json",{cache:"no-store"});
    if(r.ok){
      const remote=await r.json();
      if(Array.isArray(remote)&&mergeRemoteList(remote,[]))changed=true;
    }
  }catch(_){}
  if(changed){save();renderHome();if(cur)renderDetail();if(opt.notify)toast("已從雲端同步最新歌單與補齊資料")}
  else if(opt.notify)toast("目前已是最新雲端資料");
  return changed;
}
async function pushToCloud(opt={}){
  if(opt.deletedIds)opt.deletedIds.forEach(id=>deletedSongIds.add(id));
  try{
    if(opt.notify)toast("正在同步至雲端…",0);
    const compact=songs.map(s=>{
      const ref=researchFor(s);
      const o={id:s.id,title:s.title,artist:s.artist||"",lang:s.lang||"ja",genre:s.genre||"",bpm:s.bpm||null,key:s.key||"",status:s.status||"todo",note:s.note||"",updated:s.updated||0};
      if(s.lyrics&&(!ref||ref.lyrics!==s.lyrics))o.lyrics=s.lyrics;
      return o;
    });
    const pr=await fetch(CLOUD_SYNC_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({songs:compact,deletedIds:[...deletedSongIds],changedIds:opt.changedIds||[]})
    });
    if(!pr.ok)throw Error(pr.status);
    const pd=await pr.json();
    if(pd&&Array.isArray(pd.songs)&&mergeRemoteList(pd.songs,pd.deletedIds||[])){save();renderHome();if(cur)renderDetail()}
    if(opt.notify)toast("已同步至雲端（手機／電腦已互通）！");
    return true;
  }catch(e){
    if(opt.notify)toast("雲端同步失敗，請檢查網路連線");
    return false;
  }
}
$("#autoFetchMissing").onclick=()=>autoEnrichAllMissing({notify:true,force:true});
if($("#syncNowBtn"))$("#syncNowBtn").onclick=async()=>{await pushToCloud({notify:true});await syncFromCloud({notify:false})};
if($("#autoFetchSetBtn"))$("#autoFetchSetBtn").onclick=()=>autoEnrichAllMissing({notify:true,force:true});
setTimeout(async()=>{await syncFromCloud();await autoEnrichAllMissing()},1200);
setInterval(async()=>{await syncFromCloud();await autoEnrichAllMissing()},2*60*1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncFromCloud()});
